name: VProfile CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  build:
    name: Build, test, Checkstyle, and SonarQube
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache SonarQube dependencies
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('sonar-project.properties') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Test, and generate Checkstyle report
        run: mvn -B -U clean verify checkstyle:checkstyle

      - name: Run SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Check SonarQube quality gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Export commit SHA
        id: metadata
        run: echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  docker-build-push:
    name: Build and push Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.CI_AWS_ROLE_ARN || vars.CI_AWS_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{vars.ECR_REPOSITORY}}
        run: |
          docker build \
            --file Docker-files/app/multistage/Dockerfile \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$REGISTRY/$ECR_REPOSITORY:latest" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          output: vprofile-trivy-report.json
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image tags
        id: push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-trivy-report-${{ github.sha }}
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14

  update-helm:
    name: Prepare Helm approval PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build-push
    runs-on: ubuntu-latest
    env:
      HELM_REPO: ${{ github.repository_owner }}/${{ vars.HELM_REPO_NAME }}
      HELM_BRANCH: helm-approval
      PR_TITLE: "Update vproapp image to ${{ needs.docker-build-push.outputs.image_tag }}"
    steps:
      - name: Check out Helm repository on main
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ vars.HELM_REPO_NAME }}
          token: ${{ secrets.GITOPS_PAT }}
          path: helm-repo
          ref: main

      - name: Create or update approval branch
        working-directory: helm-repo
        run: |
          git fetch origin main
          git checkout -B "${HELM_BRANCH}" origin/main
          git push --set-upstream origin "${HELM_BRANCH}" || true

      - name: Update image and tag with yq
        working-directory: helm-repo
        env:
          REGISTRY: ${{ needs.docker-build-push.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          yq -i '.app.image = strenv(REGISTRY) + "/" + strenv(ECR_REPOSITORY) | .app.tag = strenv(IMAGE_TAG)' helm/vprofile/values.yaml
          git diff -- helm/vprofile/values.yaml

      - name: Commit and push Helm change to feature branch
        working-directory: helm-repo
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/vprofile/values.yaml
          if git diff --cached --quiet; then
            echo "No Helm value changes detected; skipping commit."
            exit 0
          fi
          git commit -m "Update vproapp image to ${IMAGE_TAG}"
          git push origin "${HELM_BRANCH}"

      - name: update pull request to main
        working-directory: helm-repo
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          if gh pr list --repo "${HELM_REPO}" --head "${HELM_BRANCH}" --base main --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "Helm approval PR already exists for ${HELM_BRANCH}."
          else
            gh pr create --repo "${HELM_REPO}" \
              --base main \
              --head "${HELM_BRANCH}" \
              --title "${PR_TITLE}" \
              --body "This PR updates the Helm values.yaml after the application pipeline builds and pushes the image. Review and merge to apply the change to main."
          fi

      - name: Slack notification for Helm approval PR
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [[ -z "$SLACK_WEBHOOK" ]]; then
            echo "SLACK_WEBHOOK is not configured; skipping notification"
            exit 0
          fi
          status=success
          if [[ "${{ job.status }}" != "success" ]]; then
            status=failure
          fi
          message="Helm approval update ${status}: PR created/updated for ${HELM_REPO} branch ${HELM_BRANCH} with image ${GITHUB_SHA}"
          curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg text "$message" '{text: $text}')" \
            "$SLACK_WEBHOOK"

  notify:
    name: Notify Slack
    if: always()
    needs: [build, docker-build-push, update-helm]
    runs-on: ubuntu-latest
    steps:
      - name: Send pipeline notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker-build-push.result }}
          HELM_RESULT: ${{ needs.update-helm.result }}
        run: |
          if [[ -z "$SLACK_WEBHOOK" ]]; then
            echo "SLACK_WEBHOOK is not configured; skipping notification"
            exit 0
          fi
          status=success
          if [[ "$BUILD_RESULT" == "failure" || "$DOCKER_RESULT" == "failure" || "$HELM_RESULT" == "failure" ]]; then
            status=failure
          fi
          message="VProfile pipeline ${status}: ${GITHUB_EVENT_NAME} on ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg text "$message" '{text: $text}')" \
            "$SLACK_WEBHOOK"
